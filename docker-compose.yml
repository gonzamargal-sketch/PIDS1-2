# ============================================================
# PIDS Parte 2 — Infraestructura de datos
# Escenario E8: Retención y ciclo de vida
#
# PERFILES: nadie necesita levantarlo todo para trabajar en lo suyo.
#
#   core    Postgres + MinIO + API              (~1,3 GB)  siempre
#   stream  Kafka + consumidor + simulador      (~1,3 GB)
#   orch    Airflow                             (~0,8 GB)
#   viz     Grafana                             (~0,3 GB)
#
# Fase 1: los datos viven solo en PostgreSQL (caliente) y MinIO/Iceberg
# (bronze y frío). Entran por Kafka y los mueve Airflow. Sin Redis ni Spark.
#
#   docker compose --profile core up -d
#   docker compose --profile core --profile stream up -d
#   docker compose --profile "*" up -d        # todo (integración y vídeo)
#
# Con 8 GB de RAM hay que configurar %UserProfile%\.wslconfig:
#   [wsl2]
#   memory=6GB
#   processors=4
#   swap=4GB
# ============================================================

name: pids-parte2

x-comun: &comun
  restart: unless-stopped
  networks: [pids]

services:

  # ══════════════════════════════════════════════════════════
  # CORE
  # ══════════════════════════════════════════════════════════

  postgres:
    <<: *comun
    image: postgres:16-alpine
    container_name: pids_postgres
    profiles: [core, stream, orch, viz]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pids}
      POSTGRES_USER: ${POSTGRES_USER:-pids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pids_dev_2026}
      # Para que las fechas se muestren en ISO y no en formato local
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      # Necesario para que DROP de particiones no espere a sesiones colgadas
      - -c
      - idle_in_transaction_session_timeout=60000
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      # Los .sql se ejecutan en orden alfabético la PRIMERA vez que arranca.
      # Si cambiáis el esquema: docker compose down -v && docker compose up -d
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pids} -d ${POSTGRES_DB:-pids}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m

  # MinIO archivó su edición community en 2026 y las imágenes minio/minio y
  # minio/mc desaparecieron de Docker Hub (404). Se tira de quay.io, que es
  # el registro propio de MinIO.
  #
  # VERSIÓN FIJADA A PROPÓSITO, no uséis :latest. En RELEASE.2025-05-24
  # ("Breaking Release") quitaron la consola web embebida. Esta es la última
  # que conserva el navegador de objetos completo, que es lo que se enseña
  # en el vídeo.
  minio:
    <<: *comun
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pids_minio
    profiles: [core, stream, orch, viz]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_2026}
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - minio_datos:/data
    # El healthcheck usa el endpoint HTTP en vez del binario mc, que ya no
    # está garantizado dentro de la imagen.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 640m

  # Crea los buckets y termina. Es normal que aparezca como "exited (0)".
  #
  # Usa el cliente de AWS en vez de `mc`: hace exactamente lo mismo contra la
  # API S3 y no depende de MinIO, que ya no publica imágenes mantenidas.
  minio-init:
    image: amazon/aws-cli:2.22.35
    container_name: pids_minio_init
    profiles: [core, stream, orch, viz]
    networks: [pids]
    depends_on:
      minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_2026}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://minio:9000 s3 mb s3://${MINIO_BUCKET_BRONZE:-bronze} 2>/dev/null;
        aws --endpoint-url http://minio:9000 s3 mb s3://${MINIO_BUCKET_LAKEHOUSE:-lakehouse} 2>/dev/null;
        echo '>>> Buckets disponibles:';
        aws --endpoint-url http://minio:9000 s3 ls
      "

  # FastAPI: router de consultas sobre los dos tiers (P3, paso 10).
  #
  # El código se monta en vez de copiarse a la imagen, con la misma
  # estructura que el repo (/app/api, /app/common): los imports son los
  # mismos dentro y fuera del contenedor, y un cambio no pide rebuild.
  api:
    <<: *comun
    build: ./api
    container_name: pids_api
    profiles: [core, stream, orch, viz]
    depends_on:
      postgres: {condition: service_healthy}
      minio:    {condition: service_healthy}
    env_file: .env
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/api"]
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    volumes:
      - ./api:/app/api
      - ./common:/app/common:ro
    # La imagen slim no trae curl: se comprueba con el propio Python
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 384m

  # ══════════════════════════════════════════════════════════
  # STREAM  (P2)
  # ══════════════════════════════════════════════════════════

  kafka:
    <<: *comun
    image: apache/kafka:3.9.0
    container_name: pids_kafka
    profiles: [stream]
    environment:
      # Modo KRaft: sin Zookeeper, un solo contenedor
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT_HOST:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${KAFKA_PORT_HOST:-9092}:29092"
    volumes:
      - kafka_datos:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 1200m

  # Replay de 2020 con reloj desplazado (P2, paso 6). Hasta que exista
  # simulador/simulador.py (T2.1) el contenedor sale con error: es normal.
  # El sumidero se elige con --sumidero {postgres,kafka}; aquí va a Kafka,
  # que es la única entrada en vivo. Para escribir directo a PostgreSQL:
  #   docker compose run --rm simulador python -m simulador.simulador --sumidero postgres
  simulador:
    <<: *comun
    build: ./simulador
    container_name: pids_simulador
    profiles: [stream]
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    env_file: .env
    volumes:
      - ./simulador:/app/simulador
      - ./common:/app/common:ro
      # SIMULADOR_SEMILLA_CSV=/datos/muestra_1000.csv
      - ./datos:/datos:ro
    mem_limit: 192m

  # Kafka → validación → caliente + cuarentena (P2, paso 7). Hasta que
  # exista ingesta/consumidor_kafka.py (T2.2) sale con error: es normal.
  consumidor:
    <<: *comun
    build: ./ingesta
    container_name: pids_consumidor
    profiles: [stream]
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    env_file: .env
    volumes:
      - ./ingesta:/app/ingesta
      - ./common:/app/common:ro
    mem_limit: 192m

  # ══════════════════════════════════════════════════════════
  # ORCH  (P4)
  # ══════════════════════════════════════════════════════════

  # Airflow standalone: scheduler, api-server y dag-processor en un solo
  # contenedor. Sus metadatos van a SQLite en un volumen propio, no a
  # nuestro PostgreSQL, para no mezclar sus tablas con las del proyecto.
  #
  # El código del proyecto se monta en /opt/pids con la misma estructura
  # que el repo. Los DAGs lo ejecutan con /opt/pids-venv/bin/python (ver
  # airflow/Dockerfile), que tiene PYTHONPATH=/opt/pids.
  airflow:
    <<: *comun
    build: ./airflow
    container_name: pids_airflow
    profiles: [orch]
    depends_on:
      postgres:   {condition: service_healthy}
      minio:      {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
      # Entorno de desarrollo: sin pantalla de login
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      # Con los valores por defecto roza el GB. Cuatro DAGs no necesitan más.
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__CORE__PARALLELISM: "4"
      PYTHONPATH: /opt/pids
    ports:
      - "${AIRFLOW_PORT_HOST:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/pids/common:ro
      - ./archivado:/opt/pids/archivado:ro
      - airflow_datos:/opt/airflow/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 1g

  # ══════════════════════════════════════════════════════════
  # VIZ  (P4)
  # ══════════════════════════════════════════════════════════

  # Un único datasource, PostgreSQL. Datasources y dashboards se
  # aprovisionan desde ./grafana/provisioning (T4.4).
  grafana:
    <<: *comun
    image: grafana/grafana-oss:12.4.3
    container_name: pids_grafana
    profiles: [viz]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT_HOST:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_datos:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 320m

volumes:
  postgres_datos:
  minio_datos:
  kafka_datos:
  airflow_datos:
  grafana_datos:

networks:
  pids:
    driver: bridge
