<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de viajes · E8</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a;
    --border: #e1e5ea; --accent: #2f6fde;
    --hot: #e0612f; --hot-soft: #fde9e0; --cold: #2f7fd1; --cold-soft: #e0edfb;
    --warn-bg: #fff6db; --warn-text: #7a5a00; --err-bg: #fde8e8; --err-text: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1e24; --text: #e6e9ee; --muted: #9aa5b3;
      --border: #2b313a; --accent: #6b9cf0;
      --hot: #f08457; --hot-soft: #3a2419; --cold: #5ea3ea; --cold-soft: #182a3d;
      --warn-bg: #3a3015; --warn-text: #f1d58a; --err-bg: #3d1c1c; --err-text: #f5b1b1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1e24; --text: #e6e9ee; --muted: #9aa5b3;
    --border: #2b313a; --accent: #6b9cf0;
    --hot: #f08457; --hot-soft: #3a2419; --cold: #5ea3ea; --cold-soft: #182a3d;
    --warn-bg: #3a3015; --warn-text: #f1d58a; --err-bg: #3d1c1c; --err-text: #f5b1b1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  header nav { margin-left: auto; display: flex; gap: 12px; }
  a { color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px;
  }
  input[type=number] { width: 110px; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; padding: 8px 16px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .presets span { color: var(--muted); font-size: 12px; }
  .chip-btn {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    font-weight: 400; padding: 4px 10px; border-radius: 999px; font-size: 13px;
  }
  .chip-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tier { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .tier.hot { background: var(--hot-soft); color: var(--hot); }
  .tier.cold { background: var(--cold-soft); color: var(--cold); }
  .tier.mixto { background: linear-gradient(90deg, var(--cold-soft), var(--hot-soft)); color: var(--text); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); }
  .bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .bar .hot { background: var(--hot); } .bar .cold { background: var(--cold); }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tramos { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .tramos li { padding: 3px 0; font-variant-numeric: tabular-nums; }
  svg { display: block; width: 100%; height: 160px; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
  .msg.err { background: var(--err-bg); color: var(--err-text); }
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
  th.num, td.num { text-align: right; }
  tbody tr:hover { background: var(--bg); }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .pager button { padding: 4px 10px; background: transparent; color: var(--text); border-color: var(--border); font-weight: 400; }
  .vacio { color: var(--muted); text-align: center; padding: 28px 0; }
  .oculto { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Visor de viajes</h1>
    <p>Consulta <code>/trips</code> por <code>event_time</code> · todas las horas en <b>UTC</b></p>
    <nav><a href="/docs">Swagger</a><a href="/stats" target="_blank">/stats</a></nav>
  </header>

  <section class="panel">
    <form id="form">
      <label>Desde (incluido)<input type="datetime-local" id="desde" step="60" required></label>
      <label>Hasta (excluido)<input type="datetime-local" id="hasta" step="60" required></label>
      <label>Límite de filas<input type="number" id="limite" min="1" max="100000" value="1000"></label>
      <button type="submit" id="consultar">Consultar</button>
    </form>
    <div class="presets" id="presets">
      <span>Rangos rápidos:</span>
    </div>
  </section>

  <div id="mensaje"></div>

  <div id="resultado" class="oculto">
    <div class="cards">
      <div class="card"><div class="k">Origen de los datos</div><div class="v" id="c-source"></div></div>
      <div class="card"><div class="k">Viajes devueltos</div><div class="v" id="c-rows"></div></div>
      <div class="card"><div class="k">Latencia</div><div class="v" id="c-lat"></div></div>
      <div class="card"><div class="k">Importe total</div><div class="v" id="c-total"></div></div>
      <div class="card"><div class="k">Distancia media</div><div class="v" id="c-dist"></div></div>
    </div>

    <section class="panel">
      <h2>¿De qué tier sale cada tramo?</h2>
      <div class="legend"><span><i style="background:var(--cold)"></i>Frío · Iceberg en MinIO</span><span><i style="background:var(--hot)"></i>Caliente · PostgreSQL</span></div>
      <div class="bar" id="bar"></div>
      <div class="axis"><span id="ax-ini"></span><span id="ax-fin"></span></div>
      <ul class="tramos" id="tramos"></ul>
    </section>

    <section class="panel">
      <h2>Viajes en el tiempo</h2>
      <svg id="hist" role="img" aria-label="Viajes por intervalo de tiempo, coloreados por tier"></svg>
      <div class="axis"><span id="hx-ini"></span><span id="hx-fin"></span></div>
    </section>

    <section class="panel">
      <h2>Viajes</h2>
      <div class="tabla-wrap">
        <table>
          <thead><tr id="cabecera"></tr></thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="pag-info"></span>
        <button id="pag-ant" type="button">‹ Anterior</button>
        <button id="pag-sig" type="button">Siguiente ›</button>
      </div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const DIA = 86400000;
const POR_PAGINA = 50;
const PAGOS = {1: "Tarjeta", 2: "Efectivo", 3: "Sin cargo", 4: "Disputa", 5: "Desconocido", 6: "Anulado"};
const fmtNum = new Intl.NumberFormat("es-ES");
const fmtEur = new Intl.NumberFormat("es-ES", {style: "currency", currency: "USD"});

// Columnas de la tabla: [clave, título, formateador, numérica]
const COLUMNAS = [
  ["_tier", "Tier", (v) => `<span class="tier ${v}">${v === "hot" ? "caliente" : "frío"}</span>`],
  ["event_time", "event_time (UTC)", fmtFecha],
  ["tpep_pickup_datetime", "Recogida", fmtFecha],
  ["tpep_dropoff_datetime", "Llegada", fmtFecha],
  ["passenger_count", "Pasajeros", (v) => v ?? "—", true],
  ["trip_distance", "Distancia (mi)", (v) => v == null ? "—" : v.toFixed(2), true],
  ["pu_location_id", "Zona origen", (v) => v ?? "—", true],
  ["do_location_id", "Zona destino", (v) => v ?? "—", true],
  ["payment_type", "Pago", (v) => PAGOS[v] ?? v ?? "—"],
  ["fare_amount", "Tarifa", (v) => v == null ? "—" : fmtEur.format(v), true],
  ["tip_amount", "Propina", (v) => v == null ? "—" : fmtEur.format(v), true],
  ["total_amount", "Total", (v) => v == null ? "—" : fmtEur.format(v), true],
  ["origen", "Origen", (v) => v ?? "—"],
];

let filas = [], pagina = 0, orden = {clave: "event_time", asc: true};

function fmtFecha(iso) {
  if (!iso) return "—";
  return iso.slice(0, 19).replace("T", " ");
}
// datetime-local <-> Date, siempre leyendo el valor como UTC
function aInput(d) { return d.toISOString().slice(0, 16); }
function deInput(v) { return new Date(v + ":00Z"); }
function inicioDia(d) { return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }

function presets() {
  const ahora = new Date();
  const hoy = inicioDia(ahora);
  const minuto = new Date(Math.ceil(ahora / 60000) * 60000);
  return [
    ["Última hora", new Date(minuto - 3600000), minuto, "caliente"],
    ["Últimos 7 días", new Date(hoy - 6 * DIA), new Date(hoy.getTime() + DIA), "caliente"],
    ["Hace 45 días (2 días)", new Date(hoy - 45 * DIA), new Date(hoy - 43 * DIA), "frío"],
    ["Cruzando la frontera", new Date(hoy - 34 * DIA), new Date(hoy - 26 * DIA), "mixto"],
    ["Todo 2026", new Date(Date.UTC(ahora.getUTCFullYear(), 0, 1)), new Date(hoy.getTime() + DIA), "mixto"],
  ];
}

function pintarPresets() {
  for (const [nombre, d, h] of presets()) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip-btn"; b.textContent = nombre;
    b.onclick = () => { $("desde").value = aInput(d); $("hasta").value = aInput(h); consultar(); };
    $("presets").appendChild(b);
  }
}

function mensaje(texto, tipo) {
  $("mensaje").innerHTML = texto ? `<div class="msg ${tipo}">${texto}</div>` : "";
}

async function consultar(ev) {
  if (ev) ev.preventDefault();
  const desde = deInput($("desde").value), hasta = deInput($("hasta").value);
  const limite = $("limite").value || 1000;
  const params = new URLSearchParams({desde: desde.toISOString(), hasta: hasta.toISOString(), limite});
  history.replaceState(null, "", "?" + new URLSearchParams({desde: $("desde").value, hasta: $("hasta").value, limite}));

  $("consultar").disabled = true; $("consultar").textContent = "Consultando…";
  mensaje("", "");
  try {
    const r = await fetch("/trips?" + params);
    const cuerpo = await r.json();
    if (!r.ok) {
      const det = typeof cuerpo.detail === "string" ? cuerpo.detail : JSON.stringify(cuerpo.detail);
      throw new Error(`Error ${r.status}: ${det}`);
    }
    pintar(cuerpo, desde, hasta, Number(limite));
  } catch (e) {
    $("resultado").classList.add("oculto");
    mensaje(e.message, "err");
  } finally {
    $("consultar").disabled = false; $("consultar").textContent = "Consultar";
  }
}

function tierDe(momento, coverage) {
  for (const t of coverage) {
    if (momento >= new Date(t.desde) && momento < new Date(t.hasta)) return t.tier;
  }
  return coverage.length ? coverage[coverage.length - 1].tier : "hot";
}

function pintar({data, meta}, desde, hasta, limite) {
  filas = data.map((f) => ({...f, _tier: tierDe(new Date(f.event_time), meta.coverage)}));
  pagina = 0;

  const nombres = {hot: "caliente", cold: "frío", mixto: "mixto"};
  $("c-source").innerHTML = `<span class="tier ${meta.data_source}" style="font-size:16px">${nombres[meta.data_source]}</span>`;
  $("c-rows").textContent = fmtNum.format(meta.rows);
  $("c-lat").textContent = `${fmtNum.format(Math.round(meta.latency_ms))} ms`;
  const total = filas.reduce((s, f) => s + (f.total_amount || 0), 0);
  const dist = filas.length ? filas.reduce((s, f) => s + (f.trip_distance || 0), 0) / filas.length : 0;
  $("c-total").textContent = fmtEur.format(total);
  $("c-dist").textContent = `${dist.toFixed(2)} mi`;

  if (meta.rows >= limite) {
    mensaje(`Se ha llegado al límite de ${fmtNum.format(limite)} filas: hay más viajes en el rango de los que se muestran. Subid el límite o acotad el rango.`, "warn");
  } else if (!meta.rows) {
    mensaje("No hay viajes en ese rango. Si esperabais datos recientes, comprobad que el flujo en vivo (perfil <code>stream</code>) está encendido.", "warn");
  }

  // Primero se muestra: el histograma necesita el ancho real del SVG
  $("resultado").classList.remove("oculto");
  pintarCoverage(meta.coverage, desde, hasta);
  pintarHistograma(desde, hasta);
  pintarTabla();
}

function pintarCoverage(coverage, desde, hasta) {
  const span = hasta - desde;
  $("bar").innerHTML = coverage.map((t) => {
    const ini = Math.max(new Date(t.desde), desde), fin = Math.min(new Date(t.hasta), hasta);
    const pct = Math.max(0, (fin - ini) / span * 100);
    return `<div class="${t.tier}" style="width:${pct}%" title="${t.tier}: ${fmtFecha(t.desde)} → ${fmtFecha(t.hasta)}">${pct > 12 ? (t.tier === "hot" ? "caliente" : "frío") : ""}</div>`;
  }).join("");
  $("ax-ini").textContent = fmtFecha(desde.toISOString());
  $("ax-fin").textContent = fmtFecha(hasta.toISOString());
  $("tramos").innerHTML = coverage.map((t) => {
    const n = filas.filter((f) => f._tier === t.tier && new Date(f.event_time) >= new Date(t.desde) && new Date(f.event_time) < new Date(t.hasta)).length;
    return `<li><span class="tier ${t.tier}">${t.tier === "hot" ? "caliente" : "frío"}</span> ${fmtFecha(t.desde)} → ${fmtFecha(t.hasta)} · ${fmtNum.format(n)} viajes</li>`;
  }).join("");
}

function pintarHistograma(desde, hasta) {
  const svg = $("hist");
  const ancho = svg.clientWidth || 800, alto = 160, n = 60;
  const paso = (hasta - desde) / n;
  const cubos = Array.from({length: n}, () => ({hot: 0, cold: 0}));
  for (const f of filas) {
    const i = Math.min(n - 1, Math.floor((new Date(f.event_time) - desde) / paso));
    if (i >= 0) cubos[i][f._tier]++;
  }
  const max = Math.max(1, ...cubos.map((c) => c.hot + c.cold));
  const w = ancho / n;
  svg.setAttribute("viewBox", `0 0 ${ancho} ${alto}`);
  svg.innerHTML = cubos.map((c, i) => {
    const hc = (c.cold / max) * (alto - 8), hh = (c.hot / max) * (alto - 8);
    const x = i * w + 1, bw = Math.max(1, w - 2);
    const ini = new Date(desde.getTime() + i * paso), fin = new Date(desde.getTime() + (i + 1) * paso);
    const tip = `${fmtFecha(ini.toISOString())} → ${fmtFecha(fin.toISOString())}: ${c.cold + c.hot} viajes`;
    return `<g><title>${tip}</title>` +
      (c.cold ? `<rect x="${x}" y="${alto - hc}" width="${bw}" height="${hc}" fill="var(--cold)" rx="2"/>` : "") +
      (c.hot ? `<rect x="${x}" y="${alto - hc - hh}" width="${bw}" height="${hh}" fill="var(--hot)" rx="2"/>` : "") +
      `<rect x="${x}" y="0" width="${bw}" height="${alto}" fill="transparent"/></g>`;
  }).join("");
  $("hx-ini").textContent = fmtFecha(desde.toISOString());
  $("hx-fin").textContent = fmtFecha(hasta.toISOString());
}

function pintarTabla() {
  $("cabecera").innerHTML = COLUMNAS.map(([clave, titulo, , num]) => {
    const flecha = orden.clave === clave ? (orden.asc ? " ▲" : " ▼") : "";
    return `<th data-clave="${clave}" class="${num ? "num" : ""}">${titulo}${flecha}</th>`;
  }).join("");
  for (const th of $("cabecera").children) {
    th.onclick = () => {
      const c = th.dataset.clave;
      orden = {clave: c, asc: orden.clave === c ? !orden.asc : true};
      pagina = 0; pintarTabla();
    };
  }

  const ordenadas = [...filas].sort((a, b) => {
    const x = a[orden.clave], y = b[orden.clave];
    if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * (orden.asc ? 1 : -1);
  });
  const paginas = Math.max(1, Math.ceil(ordenadas.length / POR_PAGINA));
  const trozo = ordenadas.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);

  $("cuerpo").innerHTML = trozo.length
    ? trozo.map((f) => "<tr>" + COLUMNAS.map(([clave, , fmt, num]) =>
        `<td class="${num ? "num" : ""}">${fmt(f[clave])}</td>`).join("") + "</tr>").join("")
    : `<tr><td class="vacio" colspan="${COLUMNAS.length}">Sin viajes en este rango</td></tr>`;

  $("pag-info").textContent = filas.length
    ? `${fmtNum.format(pagina * POR_PAGINA + 1)}–${fmtNum.format(pagina * POR_PAGINA + trozo.length)} de ${fmtNum.format(filas.length)} · página ${pagina + 1} de ${paginas}`
    : "";
  $("pag-ant").disabled = pagina === 0;
  $("pag-sig").disabled = pagina >= paginas - 1;
}

$("pag-ant").onclick = () => { pagina--; pintarTabla(); };
$("pag-sig").onclick = () => { pagina++; pintarTabla(); };
$("form").addEventListener("submit", consultar);

// Arranque: rango de la URL (?desde=…&hasta=…) o, si no hay, uno que cruza la frontera
pintarPresets();
const q = new URLSearchParams(location.search);
const [, d0, h0] = presets()[3];
$("desde").value = q.get("desde") || aInput(d0);
$("hasta").value = q.get("hasta") || aInput(h0);
if (q.get("limite")) $("limite").value = q.get("limite");
consultar();
</script>
</body>
</html>
